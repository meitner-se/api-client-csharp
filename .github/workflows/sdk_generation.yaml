name: Generate
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: optionally set a specific SDK version
        type: string
  schedule:
    - cron: 0 0 * * *
  pull_request:
    types:
      - labeled
      - unlabeled
jobs:
  generate:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@v15.61.0
    with:
      force: ${{ github.event.inputs.force }}
      mode: direct
      set_version: ${{ github.event.inputs.set_version }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
  # Speakeasy's executor may still run an internal "Publish C# SDK" job for C#
  # (empty git installation URL is treated as published). That job fails without
  # nuget_api_key, so this job still runs when generate fails. Restrict to
  # schedule/dispatch so PR label events cannot publish from main. A red
  # Generate run still means generate failed and must be inspected; this job
  # only packs whatever is already on main.
  publish-nuget:
    needs: generate
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Read SDK version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Meitner/Meitner.csproj | head -n1 | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "Failed to read <Version> from src/Meitner/Meitner.csproj"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "SDK version is $VERSION"
      - name: Skip if version exists on nuget.org
        id: nuget
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          curl -fsS "https://api.nuget.org/v3-flatcontainer/meitner/index.json" -o /tmp/nuget-index.json
          if jq -e --arg v "$VERSION" '.versions | index($v) != null' /tmp/nuget-index.json >/dev/null; then
            echo "Meitner $VERSION is already on nuget.org; skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Meitner $VERSION is not on nuget.org; will publish"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup .NET
        if: steps.nuget.outputs.exists != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Pack
        if: steps.nuget.outputs.exists != 'true'
        run: dotnet pack src/Meitner/Meitner.csproj -c Release -o .
      - name: Log in to NuGet
        if: steps.nuget.outputs.exists != 'true'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Push to nuget.org
        if: steps.nuget.outputs.exists != 'true'
        run: dotnet nuget push ./*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
